version: '3.8'

services:
  acumeds-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acumeds-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - HOST=0.0.0.0
    volumes:
      # Persistent SQLite database storage
      - acumeds_db:/app/admin_system/database
      # Persistent media uploads storage (medicines, prescriptions, licenses)
      - acumeds_uploads:/app/static/uploads
      # Application logs
      - acumeds_logs:/app/logs
    ports:
      - "5000:5000"
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
      - "5004:5004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - acumeds-network

  nginx:
    image: nginx:alpine
    container_name: acumeds-nginx
    restart: unless-stopped
    depends_on:
      acumeds-app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - acumeds_uploads:/app/static/uploads:ro
      - ./AcuMeds_Live_Hub.html:/app/AcuMeds_Live_Hub.html:ro
    networks:
      - acumeds-network

volumes:
  acumeds_db:
    name: acumeds_db_data
  acumeds_uploads:
    name: acumeds_uploads_data
  acumeds_logs:
    name: acumeds_logs_data

networks:
  acumeds-network:
    name: acumeds_network
    driver: bridge
