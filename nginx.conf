events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 32M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream service definitions (when running in Docker network)
    upstream app_pharmacy {
        server acumeds-app:5000;
    }

    upstream app_shopkeeper {
        server acumeds-app:5001;
    }

    upstream app_admin {
        server acumeds-app:5002;
    }

    upstream app_delivery {
        server acumeds-app:5003;
    }

    upstream app_doctor {
        server acumeds-app:5004;
    }

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebRTC / WebSocket upgrades
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Main Gateway on Port 80
    server {
        listen 80;
        server_name localhost;

        # Unified Project Hub dashboard
        location /hub {
            alias /app/AcuMeds_Live_Hub.html;
            default_type text/html;
        }

        # Static assets
        location /static/ {
            alias /app/pharmacy_system/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Uploaded files
        location /static/uploads/ {
            alias /app/static/uploads/;
            expires 7d;
        }

        # Default route -> Customer / Pharmacy portal
        location / {
            proxy_pass http://app_pharmacy;
        }
    }

    # Port 5000 -> Customer Storefront
    server {
        listen 5000;
        location / {
            proxy_pass http://app_pharmacy;
        }
    }

    # Port 5001 -> Shopkeeper Portal
    server {
        listen 5001;
        location / {
            proxy_pass http://app_shopkeeper;
        }
    }

    # Port 5002 -> Admin Panel
    server {
        listen 5002;
        location / {
            proxy_pass http://app_admin;
        }
    }

    # Port 5003 -> Delivery Portal
    server {
        listen 5003;
        location / {
            proxy_pass http://app_delivery;
        }
    }

    # Port 5004 -> Doctor Telehealth Portal
    server {
        listen 5004;
        location / {
            proxy_pass http://app_doctor;
        }
    }
}
