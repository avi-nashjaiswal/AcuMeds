{% extends "base.html" %}

{% block title %}{{ t('title.login') }} - {{ t('app.name') }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-6">
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <h2 class="text-center mb-1">💼 {{ t('auth.portal_title') }}</h2>
                <p class="text-center text-muted mb-4">{{ t('auth.manage_shop') }}</p>

                <form method="POST" novalidate class="needs-validation">
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ t('auth.email_or_username') }}</label>
                        <input type="text" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">{{ t('auth.password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg">{{ t('auth.login') }}</button>
                </form>

                <hr class="my-4">
                <p class="text-center text-muted">
                    {{ t('auth.no_account') }} <a href="{{ url_for('auth.register') }}">{{ t('auth.register_here') }}</a>
                </p>
                <p class="text-center text-muted mt-3">
                    <small><a href="http://localhost:5000/">← {{ t('auth.back_to_main_app') }}</a></small>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
