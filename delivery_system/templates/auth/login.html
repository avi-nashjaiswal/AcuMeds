{% extends "base.html" %}

{% block title %}{{ t('title.login') }} - {{ t('app.name') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h3 class="card-title text-center mb-4">
                    <i class="fas fa-sign-in-alt me-2"></i>{{ t('auth.sign_in_title') }}
                </h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="identity" class="form-label">{{ t('auth.identity') }}</label>
                        <input type="text" class="form-control" id="identity" name="identity" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ t('auth.password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ t('home.sign_in') }}</button>
                </form>
                <div class="alert alert-info mt-4 mb-0">
                    <div><strong>{{ t('auth.demo_delivery') }}:</strong> delivery1 / delivery123</div>
                    <div><strong>{{ t('auth.note') }}</strong></div>
                </div>
                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.register') }}">{{ t('auth.create_new') }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
