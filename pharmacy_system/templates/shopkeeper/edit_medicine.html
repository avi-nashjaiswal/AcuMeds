{% extends "base.html" %}

{% block title %}Edit Medicine - AcuMeds Shopkeeper{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">✏️ Edit Medicine</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" novalidate class="needs-validation">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Medicine Name *</label>
                                <input type="text" class="form-control" id="name" name="name" value="{{ medicine.name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="category" class="form-label">Category *</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="">Select Category</option>
                                    <option value="Painkillers" {% if medicine.category == 'Painkillers' %}selected{% endif %}>Painkillers</option>
                                    <option value="Antibiotics" {% if medicine.category == 'Antibiotics' %}selected{% endif %}>Antibiotics</option>
                                    <option value="Cold & Cough" {% if medicine.category == 'Cold & Cough' %}selected{% endif %}>Cold & Cough</option>
                                    <option value="Antacids" {% if medicine.category == 'Antacids' %}selected{% endif %}>Antacids</option>
                                    <option value="Vitamins" {% if medicine.category == 'Vitamins' %}selected{% endif %}>Vitamins</option>
                                    <option value="Antihistamines" {% if medicine.category == 'Antihistamines' %}selected{% endif %}>Antihistamines</option>
                                    <option value="Diabetes" {% if medicine.category == 'Diabetes' %}selected{% endif %}>Diabetes</option>
                                    <option value="Other" {% if medicine.category == 'Other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ medicine.description or '' }}</textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="strength_value" class="form-label">Power (Strength)</label>
                                <input type="number" class="form-control" id="strength_value" name="strength_value" step="0.01" min="0" value="{{ medicine.strength_value or '' }}" placeholder="e.g., 500">
                                <small class="text-muted">Tablets: mg/mcg. Syrups: mg/5ml.</small>
                            </div>
                            <div class="col-md-6">
                                <label for="strength_unit" class="form-label">Unit</label>
                                <select class="form-select" id="strength_unit" name="strength_unit">
                                    <option value="">Select Unit</option>
                                    <option value="mg" {% if medicine.strength_unit == 'mg' %}selected{% endif %}>mg</option>
                                    <option value="mcg" {% if medicine.strength_unit == 'mcg' %}selected{% endif %}>mcg</option>
                                    <option value="g" {% if medicine.strength_unit == 'g' %}selected{% endif %}>g</option>
                                    <option value="mg/5ml" {% if medicine.strength_unit == 'mg/5ml' %}selected{% endif %}>mg/5ml</option>
                                    <option value="mg/ml" {% if medicine.strength_unit == 'mg/ml' %}selected{% endif %}>mg/ml</option>
                                    <option value="IU" {% if medicine.strength_unit == 'IU' %}selected{% endif %}>IU</option>
                                    <option value="ml" {% if medicine.strength_unit == 'ml' %}selected{% endif %}>ml</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="price" class="form-label">Price (₹) *</label>
                                <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" value="{{ medicine.price }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="stock_quantity" class="form-label">Stock Quantity *</label>
                                <input type="number" class="form-control" id="stock_quantity" name="stock_quantity" min="0" value="{{ medicine.stock_quantity }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="side_effects" class="form-label">Side Effects</label>
                            <textarea class="form-control" id="side_effects" name="side_effects" rows="2">{{ medicine.side_effects or '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="usage_instructions" class="form-label">Usage Instructions</label>
                            <textarea class="form-control" id="usage_instructions" name="usage_instructions" rows="2">{{ medicine.usage_instructions or '' }}</textarea>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="requires_prescription" name="requires_prescription" {% if medicine.requires_prescription %}checked{% endif %}>
                            <label class="form-check-label" for="requires_prescription">
                                Requires Prescription
                            </label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg flex-grow-1">Save Changes</button>
                            <a href="{{ url_for('shopkeeper.dashboard') }}" class="btn btn-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.card {
    border: none;
    border-radius: 12px;
}
</style>
{% endblock %}
