{% extends "base.html" %}

{% block title %}Upload Prescription{% endblock %}

{% block content %}
<h1 class="mb-4">Upload Prescription</h1>

<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('prescription.upload') }}">
            <div class="mb-3">
                <label class="form-label">Choose file</label>
                <input type="file" name="prescription_file" class="form-control" required>
            </div>
            <button class="btn btn-primary">Upload</button>
        </form>
    </div>
</div>

{% endblock %}
