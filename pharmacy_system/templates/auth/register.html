{% extends "base.html" %}

{% block title %}{{ t('title.register') }} - {{ t('app.name') }}{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h3 class="card-title text-center mb-4">
                        <i class="fas fa-user-plus"></i> {{ t('nav.register') }}
                    </h3>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">{{ t('auth.username') }}</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">{{ t('auth.email_address') }}</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">{{ t('auth.password') }}</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                            <small class="form-text text-muted">{{ t('auth.password_hint') }}</small>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">{{ t('auth.confirm_password') }}</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-user-check"></i> {{ t('auth.create_account') }}
                        </button>
                    </form>

                    <hr>
                    <p class="text-center mb-0">
                        {{ t('auth.already_have_account') }} 
                        <a href="{{ url_for('auth.login') }}">{{ t('auth.login_here') }}</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
