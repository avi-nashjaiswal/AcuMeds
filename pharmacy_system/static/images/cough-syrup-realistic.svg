<svg viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="syrupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7BC97B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5FA35F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1a5a1a;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Bottle Body -->
  <ellipse cx="100" cy="80" rx="40" ry="10" fill="url(#syrupGrad)" filter="url(#shadow)"/>
  <path d="M 60 80 L 55 180 Q 55 200 75 210 L 125 210 Q 145 200 145 180 L 140 80" fill="url(#syrupGrad)" stroke="#4a7c4a" stroke-width="1.5"/>
  
  <!-- Liquid inside -->
  <path d="M 62 150 L 57 180 Q 57 195 75 205 L 125 205 Q 143 195 143 180 L 138 150" fill="url(#liquidGrad)"/>
  
  <!-- Bottle Cap -->
  <rect x="88" y="40" width="24" height="18" rx="2" fill="#333333"/>
  <ellipse cx="100" cy="40" rx="15" ry="6" fill="#555555"/>
  
  <!-- White Label -->
  <rect x="58" y="95" width="84" height="70" fill="#ffffff" rx="2" opacity="0.95"/>
  
  <!-- Label Text -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#228B22" text-anchor="middle">COUGH SYRUP</text>
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="10" fill="#228B22" text-anchor="middle">100 ml</text>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="8" fill="#666666" text-anchor="middle">Cold & Cough Relief</text>
  <line x1="62" y1="150" x2="138" y2="150" stroke="#ddd" stroke-width="0.5"/>
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="7" fill="#999" text-anchor="middle">Use: As directed by doctor</text>
  
  <!-- Glass Shine -->
  <ellipse cx="75" cy="100" rx="6" ry="25" fill="white" opacity="0.35"/>
</svg>