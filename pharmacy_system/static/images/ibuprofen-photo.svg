<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGrad2" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" style="stop-color:#4db8ff;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#2ca3e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a8fd1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0f7ac1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#094ba8;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="glassShine2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.5" />
      <stop offset="15%" style="stop-color:white;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="capGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ebebeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0c0c0;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow3D2">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="480" rx="80" ry="12" fill="black" opacity="0.2"/>
  
  <!-- Main Bottle -->
  <g filter="url(#shadow3D2)">
    <!-- Bottle body -->
    <path d="M 110 150 Q 100 200 105 280 Q 108 350 125 400 L 275 400 Q 292 350 295 280 Q 300 200 290 150 Z" 
          fill="url(#bottleGrad2)" stroke="#0066cc" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Glass shine left -->
    <path d="M 120 160 Q 118 220 120 310 Q 122 370 130 395" 
          stroke="url(#glassShine2)" stroke-width="16" fill="none" opacity="0.5"/>
    
    <!-- Extra shine highlight -->
    <circle cx="145" cy="240" r="6" fill="white" opacity="0.25"/>
    
    <!-- Bottle neck -->
    <rect x="165" y="80" width="70" height="75" rx="8" fill="url(#bottleGrad2)" stroke="#0055aa" stroke-width="1"/>
    
    <!-- Cap -->
    <g>
      <ellipse cx="200" cy="75" rx="42" ry="12" fill="url(#capGrad2)" stroke="#999" stroke-width="1"/>
      <ellipse cx="200" cy="65" rx="45" ry="14" fill="url(#capGrad2)"/>
      <ellipse cx="200" cy="62" rx="45" ry="8" fill="#ffffff" opacity="0.7"/>
      
      <!-- Cap text -->
      <text x="200" y="72" font-family="Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#1a8fd1">OPEN</text>
    </g>
  </g>
  
  <!-- Label -->
  <rect x="100" y="195" width="200" height="155" rx="5" fill="white" stroke="#ddd" stroke-width="2" opacity="0.96"/>
  
  <!-- Blue stripe -->
  <rect x="100" y="195" width="200" height="15" fill="#0f7ac1" rx="5 5 0 0"/>
  <text x="200" y="207" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">IBUPROFEN</text>
  
  <!-- Main name -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#0f7ac1">IBUPROFEN</text>
  
  <!-- Dosage -->
  <rect x="115" y="255" width="170" height="28" fill="#e3f2fd" rx="3" stroke="#0f7ac1" stroke-width="1"/>
  <text x="200" y="276" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">400 mg Tablets</text>
  
  <!-- Description -->
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1565c0">Anti-Inflammatory Pain Relief</text>
  <text x="200" y="328" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Effective for Joint & Muscle Pain</text>
  <text x="200" y="343" font-family="Arial, sans-serif" font-size="9" fill="#999">200 Tablets | Consult doctor before use</text>
</svg>