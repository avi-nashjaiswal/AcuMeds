  </defs>
  <!-- Bottle -->
  <path d="M 60 80 L 60 200 Q 60 220 80 220 L 120 220 Q 140 220 140 200 L 140 80" fill="url(#antacid)" stroke="#e65100" stroke-width="2"/>
  <!-- Cap -->
  <rect x="70" y="60" width="60" height="20" rx="3" fill="#fb8c00"/>
  <!-- Label -->
  <rect x="65" y="115" width="70" height="65" rx="5" fill="url(#antacidLabel)"/>
  <!-- Label Text -->
  <text x="100" y="135" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ANTACID</text>
  <text x="100" y="152" font-size="10" fill="white" text-anchor="middle">Tablet</text>
  <text x="100" y="170" font-size="9" fill="white" text-anchor="middle">Acidity Relief</text>
  <!-- Tablets -->
  <circle cx="80" cy="100" r="6" fill="#ffb74d" opacity="0.8"/>
  <circle cx="115" cy="102" r="6" fill="#ffb74d" opacity="0.8"/>
  <circle cx="90" cy="188" r="5" fill="#ffb74d" opacity="0.7"/>
  <circle cx="115" cy="192" r="5" fill="#ffb74d" opacity="0.7"/>
</svg>