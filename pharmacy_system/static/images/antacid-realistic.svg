<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe8cc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffd699;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4a460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="labelGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Bottle Body -->
  <ellipse cx="100" cy="90" rx="45" ry="12" fill="url(#bottleGrad5)" filter="url(#shadow)"/>
  <path d="M 55 90 L 50 200 Q 50 220 70 225 L 130 225 Q 150 220 150 200 L 145 90" fill="url(#bottleGrad5)" stroke="#f39c12" stroke-width="1.5"/>
  
  <!-- Bottle Cap -->
  <rect x="85" y="50" width="30" height="20" rx="3" fill="#27ae60"/>
  <rect x="82" y="45" width="36" height="8" rx="2" fill="#229954"/>
  
  <!-- Label -->
  <rect x="55" y="120" width="90" height="80" fill="url(#labelGrad5)" rx="2"/>
  
  <!-- Label Text -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">ANTACID</text>
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Chewable Tabs</text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="9" fill="#ffedd9" text-anchor="middle">20 Tablets</text>
  <rect x="58" y="188" width="84" height="1" fill="white" opacity="0.5"/>
  <text x="100" y="198" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Digestive Aid</text>
  
  <!-- Glass Shine -->
  <ellipse cx="70" cy="110" rx="8" ry="30" fill="white" opacity="0.4"/>
  <ellipse cx="65" cy="160" rx="5" ry="15" fill="white" opacity="0.3"/>
</svg>