<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGrad5" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" style="stop-color:#ffeb99;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffd966;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffb300;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#ffa500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e68900;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="glassShine5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.5" />
      <stop offset="15%" style="stop-color:white;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="capGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd0000;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow3D5">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="480" rx="80" ry="12" fill="black" opacity="0.2"/>
  
  <!-- Main Bottle -->
  <g filter="url(#shadow3D5)">
    <!-- Bottle body -->
    <path d="M 110 150 Q 100 200 105 280 Q 108 350 125 400 L 275 400 Q 292 350 295 280 Q 300 200 290 150 Z" 
          fill="url(#bottleGrad5)" stroke="#e68900" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Glass shine -->
    <path d="M 120 160 Q 118 225 120 310 Q 122 370 130 395" 
          stroke="url(#glassShine5)" stroke-width="16" fill="none" opacity="0.5"/>
    
    <!-- Extra shine dot -->
    <circle cx="140" cy="270" r="7" fill="white" opacity="0.2"/>
    
    <!-- Bottle neck -->
    <rect x="165" y="80" width="70" height="75" rx="8" fill="url(#bottleGrad5)" stroke="#cc7700" stroke-width="1"/>
    
    <!-- Red Cap -->
    <g>
      <ellipse cx="200" cy="75" rx="42" ry="12" fill="url(#capGrad5)" stroke="#aa0000" stroke-width="1"/>
      <ellipse cx="200" cy="65" rx="45" ry="14" fill="url(#capGrad5)"/>
      <ellipse cx="200" cy="62" rx="45" ry="8" fill="#ff8888" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Label -->
  <rect x="100" y="195" width="200" height="160" rx="5" fill="white" stroke="#ddd" stroke-width="2" opacity="0.97"/>
  
  <!-- Yellow header -->
  <rect x="100" y="195" width="200" height="18" fill="#ffb300" rx="5 5 0 0"/>
  <text x="200" y="208" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">VITAMIN C</text>
  
  <!-- Main name -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#e68900">VITAMIN C</text>
  
  <!-- Dosage -->
  <rect x="115" y="255" width="170" height="28" fill="#fff8e1" rx="3" stroke="#ffb300" stroke-width="1"/>
  <text x="200" y="278" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">500 mg Tablets</text>
  
  <!-- Benefits -->
  <text x="200" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#e68900">Immune System Booster</text>
  <text x="200" y="332" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Antioxidant Support</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="8" fill="#999">250 Tablets | Take 1 tablet daily with breakfast</text>
</svg>