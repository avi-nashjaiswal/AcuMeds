<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Bottle Body -->
  <ellipse cx="100" cy="90" rx="45" ry="12" fill="url(#bottleGrad)" filter="url(#shadow)"/>
  <path d="M 55 90 L 50 200 Q 50 220 70 225 L 130 225 Q 150 220 150 200 L 145 90" fill="url(#bottleGrad)" stroke="#d0d0d0" stroke-width="1.5"/>
  
  <!-- Bottle Cap -->
  <rect x="85" y="50" width="30" height="20" rx="3" fill="#333333"/>
  <rect x="82" y="45" width="36" height="8" rx="2" fill="#555555"/>
  
  <!-- Label -->
  <rect x="55" y="120" width="90" height="80" fill="url(#labelGrad)" rx="2"/>
  
  <!-- Label Text -->
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">ASPIRIN</text>
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">500 mg</text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="9" fill="#ffe0e0" text-anchor="middle">Tablets</text>
  <rect x="58" y="188" width="84" height="1" fill="white" opacity="0.5"/>
  <text x="100" y="198" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">Pain Relief</text>
  
  <!-- Glass Shine -->
  <ellipse cx="70" cy="110" rx="8" ry="30" fill="white" opacity="0.4"/>
  <ellipse cx="65" cy="160" rx="5" ry="15" fill="white" opacity="0.3"/>
</svg>