<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bottleGrad6" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" style="stop-color:#ffe0b2;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffcc80;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffb74d;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#ffa726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6f00;stop-opacity:0.9" />
    </linearGradient>
    
    <linearGradient id="glassShine6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.5" />
      <stop offset="15%" style="stop-color:white;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="capGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow3D6">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="480" rx="80" ry="12" fill="black" opacity="0.2"/>
  
  <!-- Main Bottle -->
  <g filter="url(#shadow3D6)">
    <!-- Bottle body -->
    <path d="M 110 150 Q 100 200 105 280 Q 108 350 125 400 L 275 400 Q 292 350 295 280 Q 300 200 290 150 Z" 
          fill="url(#bottleGrad6)" stroke="#ff6f00" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Glass shine -->
    <path d="M 120 160 Q 118 225 120 310 Q 122 370 130 395" 
          stroke="url(#glassShine6)" stroke-width="16" fill="none" opacity="0.5"/>
    
    <!-- Bottle neck -->
    <rect x="165" y="80" width="70" height="75" rx="8" fill="url(#bottleGrad6)" stroke="#ff6f00" stroke-width="1"/>
    
    <!-- White Cap -->
    <g>
      <ellipse cx="200" cy="75" rx="42" ry="12" fill="url(#capGrad6)" stroke="#aaa" stroke-width="1"/>
      <ellipse cx="200" cy="65" rx="45" ry="14" fill="url(#capGrad6)"/>
      <ellipse cx="200" cy="62" rx="45" ry="8" fill="#ffffff" opacity="0.7"/>
      
      <!-- Cap ridges -->
      <g stroke="#ccc" stroke-width="1.5" opacity="0.5">
        <line x1="160" y1="70" x2="155" y2="75"/>
        <line x1="175" y1="68" x2="172" y2="77"/>
        <line x1="225" y1="68" x2="228" y2="77"/>
        <line x1="240" y1="70" x2="245" y2="75"/>
      </g>
    </g>
  </g>
  
  <!-- Label -->
  <rect x="100" y="195" width="200" height="160" rx="5" fill="white" stroke="#ddd" stroke-width="2" opacity="0.97"/>
  
  <!-- Orange header -->
  <rect x="100" y="195" width="200" height="18" fill="#ff6f00" rx="5 5 0 0"/>
  <text x="200" y="208" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">ANTACID</text>
  
  <!-- Main name -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#ff6f00">ANTACID</text>
  
  <!-- Description -->
  <rect x="115" y="255" width="170" height="30" fill="#ffe0b2" rx="3" stroke="#ff6f00" stroke-width="1"/>
  <text x="200" y="278" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Chewable Tablets</text>
  
  <!-- Benefits -->
  <text x="200" y="315" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ff6f00">Fast Acid Reflux Relief</text>
  <text x="200" y="332" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Soothing Digestive Aid</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="8" fill="#999">30 Tablets | Chew 1-2 tablets as needed, up to 8 daily</text>
</svg>