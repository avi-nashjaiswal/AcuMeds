<svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="syrupBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="syrupLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Bottle -->
  <path d="M 55 80 L 55 200 Q 55 220 75 220 L 125 220 Q 145 220 145 200 L 145 80" fill="url(#syrupBottle)" stroke="#666" stroke-width="2"/>
  <!-- Cap -->
  <rect x="65" y="60" width="70" height="22" rx="3" fill="#2c3e50"/>
  <!-- Liquid inside -->
  <path d="M 57 140 L 57 200 Q 57 218 75 218 L 125 218 Q 143 218 143 200 L 143 140" fill="#b71c1c" opacity="0.7"/>
  <!-- Label -->
  <rect x="60" y="110" width="80" height="65" rx="5" fill="url(#syrupLabel)"/>
  <!-- Label Text -->
  <text x="100" y="130" font-size="13" font-weight="bold" fill="white" text-anchor="middle">COUGH</text>
  <text x="100" y="148" font-size="11" fill="white" text-anchor="middle">SYRUP</text>
  <text x="100" y="165" font-size="10" fill="white" text-anchor="middle">100ml</text>
</svg>