databases:
  - name: acumeds-db
    databaseName: pharmacy
    user: pharmacy_user
    plan: free
    region: oregon

services:
  # ==============================================================================
  # 1. User / Customer Portal (Storefront, AI Recommendations, Cart, Refills)
  # ==============================================================================
  - type: web
    name: acumed-customer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python pharmacy_system/run.py
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: acumeds-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MANUAL_UPI_ID
        value: avinashbarai722@okhdfcbank
      - key: MANUAL_UPI_NAME
        value: AcuMeds Healthcare
      - key: SMS_PROVIDER
        value: console
      - key: SMS_COUNTRY_CODE
        value: "+91"

  # ==============================================================================
  # 2. Shopkeeper Portal (Medicine Inventory, Expiry Tracking, Order Dispatch)
  # ==============================================================================
  - type: web
    name: acumed-shopkeeper
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python shopkeeper_system/run.py
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: acumeds-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # ==============================================================================
  # 3. Super Admin Panel (User Controls, UTR Approvals, Vendor Verification)
  # ==============================================================================
  - type: web
    name: acumed-admin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python admin_system/run.py
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: acumeds-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # ==============================================================================
  # 4. Doctor Telehealth Portal (Consultations, Patient History, Digital Rx)
  # ==============================================================================
  - type: web
    name: acumed-doctor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python doctor_system/run.py
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: acumeds-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # ==============================================================================
  # 5. Delivery Portal (Transit Tracking, OTP Verification, Milestone Logs)
  # ==============================================================================
  - type: web
    name: acumed-delivery
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python delivery_system/run.py
    plan: free
    region: oregon
