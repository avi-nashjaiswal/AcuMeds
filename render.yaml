services:
  - type: web
    name: acumeds
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python prod_server.py
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: MANUAL_UPI_ID
        value: avinashbarai722@okhdfcbank
      - key: MANUAL_UPI_NAME
        value: AcuMeds Healthcare
      - key: SMS_PROVIDER
        value: console
      - key: SMS_COUNTRY_CODE
        value: "+91"

