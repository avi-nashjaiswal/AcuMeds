    name: acumed-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python hub_server.py
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: URL_CUSTOMER
        value: https://acumed-customer.onrender.com
      - key: URL_SHOPKEEPER
        value: https://acumed-shopkeeper.onrender.com
      - key: URL_ADMIN
        value: https://acumed-admin.onrender.com
      - key: URL_DOCTOR
        value: https://acumed-doctor.onrender.com
      - key: URL_DELIVERY
        value: https://acumed-delivery.onrender.com
